name: sctl                         # conda activate sctl
channels:
  - conda-forge
dependencies:
  # ─── core Python stack ──────────────────────────────────────────
  - python >=3.10,<3.11            # match the 3.10 you’re using
  - pip
  - numpy 2.2                   # latest stable; avoid 2.x prerelease wheels
  - pandas >=2.2
  - scipy >=1.14
  - scikit-learn >=1.5
  - matplotlib >=3.9
  - seaborn >=0.13
  - numba >=0.61
  - llvmlite >=0.44

  # ─── single-cell / graph stack ─────────────────────────────────
  - scanpy >=1.11
  - anndata >=0.10
  - python-igraph >=0.11
  - leidenalg >=0.10
  - pynndescent >=0.5
  - umap-learn >=0.5

  # ─── misc utilities ────────────────────────────────────────────
  - requests >=2.32
  - tqdm >=4.67
  - ipython >=8.35
  - ipykernel >=6.29
  - jupyterlab_widgets
  - widgetsnbextension
  - session-info
  - session-info2
  - psutil

  # ─── install your package in editable mode ─────────────────────
  #- pip:
  #    - -e .     # assumes you run 'conda env create -f sctl.yaml' in repo root